<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Debit Dash</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1e2a4a;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  'use strict';

  // ===========================================================================
  // CONSTANTS & PALETTE
  // ===========================================================================
  const COLORS = {
    navy: '#1e2a4a',
    ledger: '#e8f5e9',
    green: '#2e7d32',
    gold: '#f9a825',
    red: '#e53935',
    white: '#ffffff',
    ruleLight: '#c8e6c9',
    ruleDark: '#a5d6a7',
    skin: '#f6cfa8',
    goldDark: '#c17900',
    paper: '#fafafa',
    paperEdge: '#b0bec5',
  };

  const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

  const MAX_GAME_WIDTH = 500;   // game area never wider than this (CSS px)
  const LANES = 3;
  const SLIDE_TIME = 0.15;      // seconds for a lane switch
  const MAX_LIVES = 3;
  const INVINCIBLE_TIME = 1.5;  // seconds of invulnerability after a hit
  const COIN_POINTS = 10;
  const COIN_RADIUS = 13;       // in drawing units (u)
  const DISTANCE_POINTS = 4;    // points per (game-area height) traveled, so faster = more points/sec
  const DEATH_ANIM_TIME = 1.4;  // seconds the spin-and-fall lasts

  // Speeds are expressed as a fraction of the game area height per second,
  // so the game feels the same on short and tall screens.
  const START_SPEED = 0.35;      // 70% of the original 0.5 starting speed
  const MAX_SPEED = 0.5;
  const RAMP_SECONDS = 90;      // time to go from start speed to max speed
  const SPEED_RAMP = (MAX_SPEED - START_SPEED) / RAMP_SECONDS; // speed gained per second
  const ROW_TIME = 0.75;        // seconds between spawn rows (at any speed)

  // Fair spacing: after one obstacle row fully passes the player, there must be
  // at least this much clear running time before the next row reaches them.
  // A two-lane move takes ~0.3s (two quick presses + 0.15s slide), so this
  // leaves comfortable margin even at top speed.
  const CLEAR_TIME = 0.55;

  // Obstacle tiles: rounded squares that fit inside one lane with padding.
  const TILE_LANE_FRAC = 0.72;  // tile width as a fraction of lane width
  const TILE_MAX = 66;          // max tile size, in drawing units (u)
  const HITBOX_SCALE = 0.88;    // hitbox is slightly smaller than the tile

  // ===========================================================================
  // CANVAS SETUP & RESIZING
  // ===========================================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let dpr = 1;
  let viewW = 0, viewH = 0;     // full window size
  let W = 0, H = 0;             // game area size
  let offsetX = 0;              // left edge of game area in the window
  let laneW = 0;                // width of a single lane
  let u = 1;                    // drawing unit, scales sprites to the screen

  function laneCenter(lane) {
    return laneW * (lane + 0.5);
  }

  function playerBaseY() {
    return H - Math.max(40, 45 * u);
  }

  function resize() {
    const oldH = H;
    const oldLaneW = laneW;

    dpr = window.devicePixelRatio || 1;
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';

    W = Math.min(viewW, MAX_GAME_WIDTH);
    H = viewH;
    offsetX = (viewW - W) / 2;
    laneW = W / LANES;
    u = Math.min(laneW / 100, H / 650);

    // Keep existing objects in proportion after a resize mid-game.
    if (oldH > 0) {
      const ry = H / oldH;
      for (const o of objects) o.y *= ry;
      for (const f of floaters) { f.y *= ry; f.x *= laneW / oldLaneW; }
      distSinceRow *= ry;
      player.x = laneCenter(player.lane);
      player.startX = player.targetX = player.x;
      player.slideT = SLIDE_TIME;
    }
  }

  // ===========================================================================
  // GAME STATE
  // ===========================================================================
  // state: 'start' | 'playing' | 'dying' | 'gameover'
  let state = 'start';
  let score = 0;
  let distancePoints = 0;       // fractional points from distance, folded into score
  let lives = MAX_LIVES;
  let speed = START_SPEED;      // fraction of H per second
  let playTime = 0;
  let scroll = 0;               // total background scroll distance (px)
  let distSinceRow = 0;
  let lastOpenLanes = null;     // open lanes of the previous obstacle row
  let objects = [];             // obstacles and coins
  let floaters = [];            // "+10" popups
  let hitFlash = 0;             // red screen flash timer
  let stateTimer = 0;           // time spent in the current state
  let globalTime = 0;

  const player = {
    lane: 1,
    x: 0,
    startX: 0,
    targetX: 0,
    slideT: SLIDE_TIME,
    runT: 0,
    invT: 0,
    deathT: 0,
  };

  function resetGame() {
    score = 0;
    distancePoints = 0;
    lives = MAX_LIVES;
    speed = START_SPEED;
    playTime = 0;
    distSinceRow = 0;
    lastOpenLanes = null;
    objects = [];
    floaters = [];
    hitFlash = 0;
    player.lane = 1;
    player.x = player.startX = player.targetX = laneCenter(1);
    player.slideT = SLIDE_TIME;
    player.invT = 0;
    player.deathT = 0;
    player.runT = 0;
  }

  function setState(s) {
    state = s;
    stateTimer = 0;
  }

  function startGame() {
    resetGame();
    setState('playing');
  }

  // ===========================================================================
  // INPUT: KEYBOARD, TOUCH (SWIPE / TAP), MOUSE
  // ===========================================================================
  function moveLane(dir) {
    if (state !== 'playing') return;
    const newLane = Math.max(0, Math.min(LANES - 1, player.lane + dir));
    if (newLane === player.lane) return;
    player.lane = newLane;
    player.startX = player.x;            // slide from wherever we are now
    player.targetX = laneCenter(newLane);
    player.slideT = 0;
  }

  function pressStart() {
    if (state === 'start') startGame();
    else if (state === 'gameover' && stateTimer > 0.4) startGame();
  }

  window.addEventListener('keydown', (e) => {
    switch (e.code) {
      case 'ArrowLeft':
      case 'KeyA':
        moveLane(-1);
        e.preventDefault();
        break;
      case 'ArrowRight':
      case 'KeyD':
        moveLane(1);
        e.preventDefault();
        break;
      case 'Space':
        pressStart();
        e.preventDefault();
        break;
    }
  });

  // Tap/click handling uses game-area coordinates.
  function handleTap(clientX, clientY) {
    const gx = clientX - offsetX;
    const gy = clientY;
    if (state === 'start') {
      startGame();
    } else if (state === 'gameover' && stateTimer > 0.4) {
      const b = playAgainButton();
      if (gx >= b.x && gx <= b.x + b.w && gy >= b.y && gy <= b.y + b.h) startGame();
    }
  }

  let touchStart = null;
  const SWIPE_MIN = 30;

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) > SWIPE_MIN && Math.abs(dx) > Math.abs(dy)) {
      moveLane(dx > 0 ? 1 : -1);
    } else if (Math.abs(dx) < SWIPE_MIN && Math.abs(dy) < SWIPE_MIN) {
      handleTap(t.clientX, t.clientY);
    }
    touchStart = null;
  }, { passive: false });

  // Mouse clicks (desktop) for start screen and Play Again button.
  canvas.addEventListener('mousedown', (e) => {
    handleTap(e.clientX, e.clientY);
  });

  window.addEventListener('resize', resize);

  // ===========================================================================
  // SPAWNING: OBSTACLE & COIN ROWS
  // ===========================================================================
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function makeObstacle(lane, y) {
    const types = ['paper', 'error', 'scale'];
    const type = types[Math.floor(Math.random() * types.length)];
    return { kind: 'obstacle', type, lane, y, phase: Math.random() * Math.PI * 2 };
  }

  function makeCoin(lane, y) {
    return { kind: 'coin', lane, y, phase: Math.random() * Math.PI * 2 };
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function spawnRow() {
    const spawnY = -TILE_MAX * u;

    // Difficulty: chance of a 2-obstacle row grows with speed.
    const difficulty = (speed - START_SPEED) / (MAX_SPEED - START_SPEED);

    if (Math.random() < 0.22) {
      // Coin-only row: a short trail of coins in one lane (above spawnY).
      const lane = pick([0, 1, 2]);
      const count = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < count; i++) objects.push(makeCoin(lane, spawnY - i * 40 * u));
      lastOpenLanes = null;
      return;
    }

    // Obstacle row: 1 or 2 obstacles, NEVER all 3 lanes.
    let open;
    if (Math.random() < 0.3 + 0.35 * difficulty) {
      // Two obstacles leave a single open lane. If the previous row also had a
      // single open lane on an edge, don't put this one on the opposite edge:
      // the player never has to cross two lanes between back-to-back tight rows.
      let candidates = [0, 1, 2];
      if (lastOpenLanes && lastOpenLanes.length === 1 && lastOpenLanes[0] !== 1) {
        candidates = [lastOpenLanes[0], 1];
      }
      open = [pick(candidates)];
    } else {
      const blockedLane = pick([0, 1, 2]);
      open = [0, 1, 2].filter((l) => l !== blockedLane);
    }
    const blocked = [0, 1, 2].filter((l) => !open.includes(l));

    // Coins never sit on obstacles: drop any coin (e.g. the tail of an earlier
    // coin trail) that would overlap a tile in this row.
    const clear = obstacleHalf() + COIN_RADIUS * u + 6 * u;
    objects = objects.filter((o) =>
      !(o.kind === 'coin' && blocked.includes(o.lane) && Math.abs(o.y - spawnY) < clear));

    for (const lane of blocked) objects.push(makeObstacle(lane, spawnY));

    // Sometimes reward an open lane with a coin.
    if (Math.random() < 0.55) objects.push(makeCoin(pick(open), spawnY));

    lastOpenLanes = open;
  }

  // ===========================================================================
  // UPDATE LOGIC
  // ===========================================================================
  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function updatePlayerSlide(dt) {
    if (player.slideT < SLIDE_TIME) {
      player.slideT = Math.min(SLIDE_TIME, player.slideT + dt);
      const t = easeOutCubic(player.slideT / SLIDE_TIME);
      player.x = player.startX + (player.targetX - player.startX) * t;
    } else {
      player.x = player.targetX;
    }
  }

  // Tile size (px) for obstacles; always narrower than a lane.
  function tileSize() {
    return Math.min(laneW * TILE_LANE_FRAC, TILE_MAX * u);
  }

  // Half-size of an obstacle hitbox: matches the tile, slightly shrunk.
  function obstacleHalf() {
    return (tileSize() / 2) * HITBOX_SCALE;
  }

  // Hitbox helpers (half sizes, in px)
  function obstacleBox(o) {
    const h = obstacleHalf();
    return { x: laneCenter(o.lane), y: o.y, hw: h, hh: h };
  }

  function playerBox() {
    const base = playerBaseY();
    return { x: player.x, y: base - 38 * u, hw: 15 * u, hh: 34 * u };
  }

  // Distance between rows (px). Guarantees CLEAR_TIME seconds of open running
  // between one row's hitboxes fully passing the player and the next row's
  // hitboxes reaching them. Uses a slightly higher speed than now so the
  // gap stays safe while the game keeps speeding up.
  function rowGapPx() {
    const safeSpeed = Math.min(MAX_SPEED, speed + 0.02) * H;
    const overlapSpan = 2 * obstacleHalf() + 2 * playerBox().hh;
    return Math.max(H * 0.28, speed * H * ROW_TIME, overlapSpan + safeSpeed * CLEAR_TIME);
  }

  function overlaps(a, b) {
    return Math.abs(a.x - b.x) < a.hw + b.hw && Math.abs(a.y - b.y) < a.hh + b.hh;
  }

  function hitPlayer() {
    lives -= 1;
    hitFlash = 0.25;
    if (lives <= 0) {
      lives = 0;
      player.deathT = 0;
      setState('dying');
    } else {
      player.invT = INVINCIBLE_TIME;
    }
  }

  function update(dt) {
    globalTime += dt;
    stateTimer += dt;
    hitFlash = Math.max(0, hitFlash - dt);

    // Floating score popups always animate.
    for (const f of floaters) { f.y -= 40 * u * dt; f.life -= dt; }
    floaters = floaters.filter((f) => f.life > 0);

    if (state === 'start') {
      // Gentle idle scroll on the title screen.
      scroll += H * 0.2 * dt;
      player.runT += dt;
      return;
    }

    if (state === 'dying') {
      player.deathT += dt;
      if (player.deathT >= DEATH_ANIM_TIME + 0.4) setState('gameover');
      return;
    }

    if (state !== 'playing') return;

    // --- Speed ramp (capped) ---
    playTime += dt;
    speed = Math.min(MAX_SPEED, START_SPEED + playTime * SPEED_RAMP);
    const pxSpeed = speed * H;

    // --- Distance points (whole points move into the score) ---
    distancePoints += speed * dt * DISTANCE_POINTS;
    const earned = Math.floor(distancePoints);
    score += earned;
    distancePoints -= earned;

    // --- Scroll world ---
    const dy = pxSpeed * dt;
    scroll += dy;
    distSinceRow += dy;

    if (distSinceRow >= rowGapPx()) {
      distSinceRow = 0;   // reset (not subtract) so rows are never closer than the gap
      spawnRow();
    }

    // --- Player ---
    updatePlayerSlide(dt);
    player.runT += dt * (0.8 + speed);
    player.invT = Math.max(0, player.invT - dt);

    // --- Objects & collisions ---
    const pb = playerBox();
    for (const o of objects) {
      o.y += dy;
      if (o.dead) continue;
      if (o.kind === 'coin') {
        const cb = { x: laneCenter(o.lane), y: o.y, hw: COIN_RADIUS * u, hh: COIN_RADIUS * u };
        if (overlaps(pb, cb)) {
          o.dead = true;
          score += COIN_POINTS;
          floaters.push({ x: cb.x, y: cb.y, text: '+' + COIN_POINTS, life: 0.8 });
        }
      } else if (player.invT <= 0 && state === 'playing') {
        if (overlaps(pb, obstacleBox(o))) {
          o.dead = true;
          hitPlayer();
        }
      }
    }
    objects = objects.filter((o) => !(o.dead && o.kind === 'coin') && o.y < H + 80 * u);
  }

  // ===========================================================================
  // DRAWING: BACKGROUND (LEDGER PAPER)
  // ===========================================================================
  function drawBackground() {
    ctx.fillStyle = COLORS.ledger;
    ctx.fillRect(0, 0, W, H);

    // Horizontal ruled lines, every 5th line a bit darker, scrolling down.
    const gap = Math.max(16, 22 * u);
    const period = gap * 5;
    const off = scroll % period;
    let idx = 0;
    for (let y = off - period; y < H + gap; y += gap, idx++) {
      ctx.fillStyle = idx % 5 === 0 ? COLORS.ruleDark : COLORS.ruleLight;
      ctx.fillRect(0, Math.round(y), W, idx % 5 === 0 ? 2 : 1);
    }

    // Faint ledger column margins near each edge.
    ctx.fillStyle = COLORS.ruleDark;
    ctx.fillRect(Math.round(8 * u), 0, 1, H);
    ctx.fillRect(Math.round(11 * u), 0, 1, H);
    ctx.fillRect(Math.round(W - 11 * u), 0, 1, H);
    ctx.fillRect(Math.round(W - 8 * u), 0, 1, H);

    // Dashed lane dividers.
    ctx.save();
    ctx.strokeStyle = COLORS.green;
    ctx.lineWidth = Math.max(2, 3 * u);
    const dash = 20 * u, space = 16 * u;
    ctx.setLineDash([dash, space]);
    ctx.lineDashOffset = -(scroll % (dash + space));
    ctx.globalAlpha = 0.7;
    for (let i = 1; i < LANES; i++) {
      const x = Math.round(laneW * i);
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ===========================================================================
  // DRAWING: PLAYER (THE ACCOUNTANT)
  // ===========================================================================
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Draws the accountant with feet at (0, 0) in the current transform.
  // frame: 0 or 1 for the two-frame running animation.
  // swing: -1..1, how far the ponytail is swung to the side.
  function drawAccountant(frame, showShadow, swing) {
    const s = u;
    const HAIR = '#4e342e';
    const PANTS = '#263238';

    // Shadow
    if (showShadow) {
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath();
      ctx.ellipse(0, 2 * s, 20 * s, 6 * s, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    const headY = -66 * s;

    // Ponytail: tied high at the back of the head, swings while running.
    // Drawn first so the head covers its base.
    const knotX = 0, knotY = headY - 14 * s;
    const dir = swing >= 0 ? 1 : -1;
    const tipX = swing * 31 * s;
    const tipY = headY + 14 * s - Math.abs(swing) * 4 * s;
    const ctrlX = swing * 34 * s;
    const ctrlY = headY - 16 * s;
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.moveTo(knotX - 5 * dir * s, knotY);
    ctx.quadraticCurveTo(ctrlX + 4 * dir * s, ctrlY, tipX + 2 * dir * s, tipY);
    ctx.quadraticCurveTo(tipX, tipY + 4 * s, tipX - 3 * dir * s, tipY - 1 * s);
    ctx.quadraticCurveTo(ctrlX - 8 * dir * s, ctrlY + 8 * s, knotX + 5 * dir * s, knotY + 4 * s);
    ctx.closePath();
    ctx.fill();

    // Legs: dark pants (alternate which leg is lifted)
    const legTop = -24 * s;
    const leftLen = frame === 0 ? 24 : 16;
    const rightLen = frame === 0 ? 16 : 24;
    ctx.fillStyle = PANTS;
    roundRect(-10 * s, legTop, 8 * s, leftLen * s, 3 * s); ctx.fill();
    roundRect(2 * s, legTop, 8 * s, rightLen * s, 3 * s); ctx.fill();
    // Shoes
    ctx.fillStyle = '#111111';
    roundRect(-11 * s, legTop + leftLen * s - 4 * s, 10 * s, 5 * s, 2 * s); ctx.fill();
    roundRect(1 * s, legTop + rightLen * s - 4 * s, 10 * s, 5 * s, 2 * s); ctx.fill();

    // Arms: navy blazer sleeves, swinging opposite to legs
    const armSwing = frame === 0 ? -3 : 3;
    ctx.fillStyle = COLORS.navy;
    roundRect(-21 * s, -50 * s + armSwing * s, 7 * s, 20 * s, 3 * s); ctx.fill();
    roundRect(14 * s, -50 * s - armSwing * s, 7 * s, 20 * s, 3 * s); ctx.fill();
    // White cuffs + hands
    ctx.fillStyle = COLORS.white;
    ctx.fillRect(-21 * s, -33 * s + armSwing * s, 7 * s, 2.5 * s);
    ctx.fillRect(14 * s, -33 * s - armSwing * s, 7 * s, 2.5 * s);
    ctx.fillStyle = COLORS.skin;
    ctx.beginPath(); ctx.arc(-17.5 * s, -28 * s + armSwing * s, 3.8 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(17.5 * s, -28 * s - armSwing * s, 3.8 * s, 0, Math.PI * 2); ctx.fill();

    // Body: navy blazer
    ctx.fillStyle = COLORS.navy;
    roundRect(-15 * s, -52 * s, 30 * s, 31 * s, 6 * s);
    ctx.fill();

    // White top showing in the blazer's V opening
    ctx.fillStyle = COLORS.white;
    ctx.beginPath();
    ctx.moveTo(-6 * s, -52 * s);
    ctx.lineTo(6 * s, -52 * s);
    ctx.lineTo(0, -35 * s);
    ctx.closePath();
    ctx.fill();

    // Lapels
    ctx.strokeStyle = '#3949ab';
    ctx.lineWidth = 1.4 * s;
    ctx.beginPath();
    ctx.moveTo(-7 * s, -52 * s); ctx.lineTo(-1 * s, -35 * s);
    ctx.moveTo(7 * s, -52 * s); ctx.lineTo(1 * s, -35 * s);
    ctx.stroke();

    // Gold buttons
    ctx.fillStyle = COLORS.gold;
    ctx.beginPath(); ctx.arc(0, -31 * s, 1.5 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -26 * s, 1.5 * s, 0, Math.PI * 2); ctx.fill();

    // Neck
    ctx.fillStyle = COLORS.skin;
    ctx.fillRect(-3.5 * s, -54 * s, 7 * s, 5 * s);

    // Long hair behind the face (frames it down to the jaw)
    ctx.fillStyle = HAIR;
    roundRect(-18 * s, headY - 14 * s, 36 * s, 30 * s, 13 * s);
    ctx.fill();

    // Head
    ctx.fillStyle = COLORS.skin;
    ctx.beginPath(); ctx.arc(0, headY, 15 * s, 0, Math.PI * 2); ctx.fill();

    // Hair on top with a side-swept fringe
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.arc(0, headY, 16 * s, Math.PI, Math.PI * 2);
    ctx.lineTo(16 * s, headY + 2 * s);
    ctx.quadraticCurveTo(10 * s, headY - 7 * s, -2 * s, headY - 6 * s);
    ctx.quadraticCurveTo(-11 * s, headY - 5 * s, -16 * s, headY + 4 * s);
    ctx.closePath();
    ctx.fill();

    // Scrunchie where the ponytail is tied
    ctx.fillStyle = COLORS.red;
    ctx.beginPath(); ctx.arc(knotX, knotY, 3.2 * s, 0, Math.PI * 2); ctx.fill();

    // Round glasses
    const gy = headY + 2 * s;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.strokeStyle = COLORS.navy;
    ctx.lineWidth = 1.5 * s;
    ctx.beginPath(); ctx.arc(-6 * s, gy, 4.6 * s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(6 * s, gy, 4.6 * s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-1.4 * s, gy); ctx.lineTo(1.4 * s, gy); ctx.stroke();
    // Eyes with little lashes
    ctx.fillStyle = COLORS.navy;
    ctx.beginPath(); ctx.arc(-6 * s, gy + 0.5 * s, 1.5 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(6 * s, gy + 0.5 * s, 1.5 * s, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 0.9 * s;
    ctx.beginPath();
    ctx.moveTo(-8 * s, gy - 1 * s); ctx.lineTo(-9 * s, gy - 2.2 * s);
    ctx.moveTo(8 * s, gy - 1 * s); ctx.lineTo(9 * s, gy - 2.2 * s);
    ctx.stroke();

    // Rosy cheeks + smile
    ctx.fillStyle = 'rgba(229,57,53,0.25)';
    ctx.beginPath(); ctx.arc(-10 * s, headY + 8 * s, 2.6 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(10 * s, headY + 8 * s, 2.6 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#c62828';
    ctx.lineWidth = 1.4 * s;
    ctx.beginPath(); ctx.arc(0, headY + 7 * s, 3.5 * s, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  }

  function drawPlayer() {
    const baseY = playerBaseY();
    const frame = Math.floor(player.runT * 8) % 2;

    ctx.save();
    ctx.translate(player.x, baseY);

    if (state === 'dying' || state === 'gameover') {
      // Spin a couple of times, then topple onto the side.
      const t = Math.min(1, player.deathT / DEATH_ANIM_TIME);
      const e = easeOutCubic(t);
      const angle = e * (Math.PI * 4 + Math.PI / 2);
      ctx.translate(0, -36 * u);
      ctx.rotate(angle);
      ctx.translate(0, 36 * u + e * 10 * u);
      drawAccountant(0, false, 0);
    } else {
      // Flash while invincible.
      if (player.invT > 0 && Math.floor(player.invT * 12) % 2 === 0) ctx.globalAlpha = 0.3;
      const running = state === 'playing' || state === 'start';
      // One full ponytail swing per two-frame run cycle.
      // Shaped so the tail lingers out to each side (visible past the hair).
      const wave = Math.sin(player.runT * 8 * Math.PI);
      const swing = running ? Math.sign(wave) * Math.pow(Math.abs(wave), 0.3) : 0.7;
      drawAccountant(running ? frame : 0, true, swing);
    }
    ctx.restore();
  }

  // ===========================================================================
  // DRAWING: OBSTACLES & COINS
  // ===========================================================================
  // Every obstacle is a rounded square tile centered in its lane. The icon is
  // drawn in a 100x100 box (-50..50) scaled to the tile and clipped to it, so
  // nothing can ever spill past the tile or the lane.
  const TILE_STYLES = {
    paper: { bg: COLORS.navy, border: '#3f51b5' },
    error: { bg: COLORS.white, border: COLORS.red },
    scale: { bg: COLORS.green, border: '#1b5e20' },
  };

  function drawObstacleTile(o) {
    const T = tileSize();
    const x = laneCenter(o.lane);
    const y = o.y;
    const left = x - T / 2, top = y - T / 2;
    const r = T * 0.18;
    const lw = T * 0.05;
    const style = TILE_STYLES[o.type];

    ctx.save();
    // Drop shadow (offset straight down, so it stays inside the lane)
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    roundRect(left, top + T * 0.06, T, T, r);
    ctx.fill();

    // Tile body
    ctx.fillStyle = style.bg;
    roundRect(left, top, T, T, r);
    ctx.fill();
    ctx.clip();

    // Border drawn inside the tile edge
    ctx.strokeStyle = style.border;
    ctx.lineWidth = lw;
    roundRect(left + lw / 2, top + lw / 2, T - lw, T - lw, r - lw / 2);
    ctx.stroke();

    // Icon
    ctx.translate(x, y);
    ctx.scale(T / 100, T / 100);
    if (o.type === 'paper') drawPaperIcon();
    else if (o.type === 'error') drawErrorIcon();
    else drawScaleIcon(o.phase);
    ctx.restore();
  }

  // Icon: a stack of paperwork with a gold binder clip.
  function drawPaperIcon() {
    const sheets = [
      { dx: 7, dy: -5, color: '#b0bec5' },
      { dx: 3.5, dy: -2.5, color: '#cfd8dc' },
      { dx: 0, dy: 0, color: COLORS.white },
    ];
    for (const sh of sheets) {
      ctx.fillStyle = sh.color;
      roundRect(-25 + sh.dx, -27 + sh.dy, 46, 58, 4);
      ctx.fill();
    }
    ctx.strokeStyle = '#90a4ae';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const ly = -12 + i * 10;
      ctx.beginPath();
      ctx.moveTo(-17, ly);
      ctx.lineTo(i === 3 ? 2 : 13, ly);
      ctx.stroke();
    }
    ctx.fillStyle = COLORS.gold;
    roundRect(-9, -32, 18, 9, 2);
    ctx.fill();
  }

  // Icon: a tilted red "ERROR" stamp mark.
  function drawErrorIcon() {
    ctx.rotate(-0.2);
    ctx.strokeStyle = COLORS.red;
    ctx.lineWidth = 4;
    roundRect(-36, -16, 72, 32, 4);
    ctx.stroke();
    ctx.lineWidth = 1.5;
    roundRect(-31, -11, 62, 22, 3);
    ctx.stroke();
    ctx.fillStyle = COLORS.red;
    ctx.font = `900 17px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('ERROR', 0, 1);
  }

  // Icon: a balance scale tipped down on the left by a stack of coins.
  function drawScaleIcon(phase) {
    ctx.fillStyle = COLORS.white;
    roundRect(-17, 30, 34, 7, 2); ctx.fill();          // base
    ctx.fillRect(-3, -20, 6, 52);                       // post

    const tilt = -0.4 + Math.sin(globalTime * 3 + phase) * 0.04;
    const half = 27, pivotY = -20;
    const lx = -Math.cos(tilt) * half, ly = pivotY - Math.sin(tilt) * half;
    const rx = Math.cos(tilt) * half, ry = pivotY + Math.sin(tilt) * half;
    ctx.strokeStyle = COLORS.white;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(rx, ry); ctx.stroke();
    ctx.fillStyle = COLORS.gold;
    ctx.beginPath(); ctx.arc(0, pivotY, 5, 0, Math.PI * 2); ctx.fill();

    const drawPan = (px, py, loaded) => {
      const drop = 17;
      ctx.strokeStyle = COLORS.white;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(px, py); ctx.lineTo(px - 11, py + drop);
      ctx.moveTo(px, py); ctx.lineTo(px + 11, py + drop);
      ctx.stroke();
      if (loaded) {
        ctx.fillStyle = COLORS.goldDark;
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.ellipse(px, py + drop - 3 - i * 4, 7, 2.6, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.fillStyle = COLORS.gold;
      ctx.beginPath();
      ctx.ellipse(px, py + drop, 13, 4.5, 0, 0, Math.PI);
      ctx.closePath();
      ctx.fill();
    };
    drawPan(lx, ly, true);
    drawPan(rx, ry, false);
  }

  function drawCoin(x, y, phase) {
    const s = u;
    const r = COIN_RADIUS * s;
    const squash = 0.55 + 0.45 * Math.abs(Math.cos(globalTime * 3 + phase));
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath(); ctx.ellipse(0, r + 3 * s, r * 0.8 * squash, 3 * s, 0, 0, Math.PI * 2); ctx.fill();

    ctx.scale(squash, 1);
    ctx.fillStyle = COLORS.goldDark;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COLORS.gold;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.84, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.35, r * 0.25, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#8d5a00';
    ctx.font = `bold ${Math.round(16 * s)}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('$', 0, 1 * s);
    ctx.restore();
  }

  function drawObjects() {
    for (const o of objects) {
      if (o.dead && o.kind === 'coin') continue;
      const x = laneCenter(o.lane);
      if (o.kind === 'coin') {
        drawCoin(x, o.y, o.phase);
      } else {
        ctx.save();
        if (o.dead) ctx.globalAlpha = 0.45;   // the obstacle we bumped into
        drawObstacleTile(o);
        ctx.restore();
      }
    }
  }

  function drawFloaters() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.round(18 * u)}px ${FONT}`;
    for (const f of floaters) {
      ctx.globalAlpha = Math.max(0, f.life / 0.8);
      ctx.fillStyle = COLORS.goldDark;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.restore();
  }

  // ===========================================================================
  // DRAWING: HUD (HEARTS & SCORE)
  // ===========================================================================
  function drawHeart(x, y, size, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.moveTo(0, size * 0.3);
    ctx.bezierCurveTo(-size * 0.05, size * 0.2, -size * 0.5, size * 0.0, -size * 0.5, -size * 0.2);
    ctx.bezierCurveTo(-size * 0.5, -size * 0.5, -size * 0.1, -size * 0.55, 0, -size * 0.25);
    ctx.bezierCurveTo(size * 0.1, -size * 0.55, size * 0.5, -size * 0.5, size * 0.5, -size * 0.2);
    ctx.bezierCurveTo(size * 0.5, size * 0.0, size * 0.05, size * 0.2, 0, size * 0.3);
    ctx.closePath();
    if (filled) {
      ctx.fillStyle = COLORS.red;
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.arc(-size * 0.25, -size * 0.25, size * 0.09, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(30,42,74,0.15)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(30,42,74,0.4)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawHUD() {
    const pad = 12;
    const size = Math.max(22, 28 * u);

    // Hearts, top-left
    for (let i = 0; i < MAX_LIVES; i++) {
      drawHeart(pad + size / 2 + i * (size + 6), pad + size / 2 + 2, size, i < lives);
    }

    // Score, top-right on a pill
    const text = 'Score: ' + score;
    ctx.font = `bold ${Math.round(Math.max(16, 20 * u))}px ${FONT}`;
    const tw = ctx.measureText(text).width;
    const ph = Math.max(28, 32 * u);
    const pw = tw + 24;
    ctx.fillStyle = 'rgba(30,42,74,0.88)';
    roundRect(W - pad - pw, pad, pw, ph, ph / 2);
    ctx.fill();
    ctx.fillStyle = COLORS.white;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, W - pad - pw / 2, pad + ph / 2 + 1);
  }

  // ===========================================================================
  // DRAWING: SCREENS (START & GAME OVER)
  // ===========================================================================
  // Wraps text to fit maxWidth; returns the y after the last line.
  // Pass draw = false to only measure.
  function wrapText(text, x, y, maxWidth, lineHeight, draw = true) {
    const words = text.split(' ');
    let line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        if (draw) ctx.fillText(line, x, y);
        line = word;
        y += lineHeight;
      } else {
        line = test;
      }
    }
    if (line) { if (draw) ctx.fillText(line, x, y); y += lineHeight; }
    return y;
  }

  const HOW_TO_LINES = [
    'Use ← → or A / D (swipe on mobile) to switch lanes.',
    'Dodge the accounting obstacles. Distance scores points, and $ coins are +10!',
  ];

  // Lays out the start screen text; with draw = false it only returns the bottom y.
  function layoutStartText(cx, py, panelW, draw) {
    // Shrink the title until it fits inside the panel.
    let titleSize = 64;
    ctx.font = `900 ${titleSize}px ${FONT}`;
    const fit = (panelW - 36) / ctx.measureText('Debit Dash').width;
    if (fit < 1) titleSize = Math.floor(titleSize * fit);
    if (draw) {
      ctx.font = `900 ${titleSize}px ${FONT}`;
      ctx.fillStyle = COLORS.gold;
      ctx.fillText('Debit Dash', cx + 3, py + titleSize * 0.95 + 3);
      ctx.fillStyle = COLORS.navy;
      ctx.fillText('Debit Dash', cx, py + titleSize * 0.95);
    }

    // Divider rule under the title
    let y = py + titleSize * 1.75;
    if (draw) {
      ctx.fillStyle = COLORS.green;
      ctx.fillRect(cx - panelW * 0.3, y - 1, panelW * 0.6, 2);
    }

    // How to play
    y += 26;
    const bodySize = Math.max(14, Math.min(18, panelW / 22));
    if (draw) {
      ctx.font = `bold ${Math.round(bodySize)}px ${FONT}`;
      ctx.fillStyle = COLORS.green;
      ctx.fillText('How to play', cx, y);
    }
    y += bodySize * 1.6;
    ctx.font = `${Math.round(bodySize)}px ${FONT}`;
    ctx.fillStyle = COLORS.navy;
    for (const line of HOW_TO_LINES) {
      y = wrapText(line, cx, y, panelW - 40, bodySize * 1.4, draw) + 4;
    }

    // Blinking prompt
    y += bodySize * 1.1;
    if (draw && Math.floor(globalTime * 2) % 2 === 0) {
      ctx.font = `bold ${Math.round(bodySize + 2)}px ${FONT}`;
      ctx.fillStyle = COLORS.red;
      ctx.fillText('Press Space or Tap to Start', cx, y);
    }
    return y + bodySize * 1.6;
  }

  function drawStartScreen() {
    const cx = W / 2;
    const panelW = Math.min(W - 32, 420);
    const px = cx - panelW / 2;
    const py = Math.max(20, H * 0.12);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const bottom = layoutStartText(cx, py, panelW, false);

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    roundRect(px, py, panelW, bottom - py, 18);
    ctx.fill();
    ctx.strokeStyle = COLORS.green;
    ctx.lineWidth = 3;
    ctx.stroke();

    layoutStartText(cx, py, panelW, true);
  }

  function playAgainButton() {
    const w = Math.min(220, W - 80);
    const h = 54;
    return { x: W / 2 - w / 2, y: H / 2 + 50, w, h };
  }

  function drawGameOverScreen() {
    const cx = W / 2;

    ctx.fillStyle = 'rgba(30,42,74,0.6)';
    ctx.fillRect(0, 0, W, H);

    const panelW = Math.min(W - 32, 380);
    const panelH = 290;
    const px = cx - panelW / 2;
    const py = H / 2 - 150;
    ctx.fillStyle = COLORS.white;
    roundRect(px, py, panelW, panelH, 18);
    ctx.fill();
    ctx.strokeStyle = COLORS.red;
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `900 ${Math.round(Math.min(48, panelW / 6.5))}px ${FONT}`;
    ctx.fillStyle = COLORS.red;
    ctx.fillText('Game Over', cx, py + 55);

    ctx.font = `bold 24px ${FONT}`;
    ctx.fillStyle = COLORS.navy;
    ctx.fillText('Score: ' + score, cx, py + 115);

    const b = playAgainButton();
    const pulse = 1 + Math.sin(globalTime * 4) * 0.03;
    ctx.save();
    ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = COLORS.goldDark;
    roundRect(-b.w / 2, -b.h / 2 + 4, b.w, b.h, 14); ctx.fill();
    ctx.fillStyle = COLORS.gold;
    roundRect(-b.w / 2, -b.h / 2, b.w, b.h, 14); ctx.fill();
    ctx.fillStyle = COLORS.navy;
    ctx.font = `bold 22px ${FONT}`;
    ctx.fillText('Play Again', 0, 1);
    ctx.restore();

    ctx.font = `14px ${FONT}`;
    ctx.fillStyle = 'rgba(30,42,74,0.7)';
    ctx.fillText('or press Space', cx, b.y + b.h + 24);
  }

  // ===========================================================================
  // MAIN RENDER
  // ===========================================================================
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Navy surround outside the game area.
    ctx.fillStyle = COLORS.navy;
    ctx.fillRect(0, 0, viewW, viewH);

    // Everything else draws inside the clipped, centered game area.
    ctx.save();
    ctx.translate(offsetX, 0);
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.clip();

    drawBackground();
    drawObjects();
    drawPlayer();
    drawFloaters();

    if (hitFlash > 0) {
      ctx.fillStyle = `rgba(229,57,53,${(hitFlash / 0.25) * 0.3})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (state === 'start') {
      drawStartScreen();
    } else {
      drawHUD();
      if (state === 'gameover') drawGameOverScreen();
    }

    ctx.restore();
  }

  // ===========================================================================
  // GAME LOOP
  // ===========================================================================
  let lastTime = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000); // clamp big gaps (tab switch)
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  resize();
  resetGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
